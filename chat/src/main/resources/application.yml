# lifey-chat — the trainer<->client chat service.
# Plan: docs/chat/44-chat-service-extraction-plan.md
#
# Shares one Neon database with lifey-api, under a different role: this service
# owns chat_* and reads users/user_settings/trainer_clients (see
# devops/chat-database-split.md). Same SPRING_DATASOURCE_URL as the monolith,
# different SPRING_DATASOURCE_USERNAME.
spring:
  application:
    name: lifey-chat
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lifey}
    # Locally the monolith's role is fine; in production this MUST be lifey_chat,
    # whose grants are what stop a bug here writing to the monolith's tables.
    username: ${SPRING_DATASOURCE_USERNAME:lifey}
    password: ${SPRING_DATASOURCE_PASSWORD:lifey}
    hikari:
      # Smaller than the monolith's 5: the SSE connections that dominate this
      # service hold no database connection at all (the emitter lives in
      # memory), so the traffic here is short transactions only. Both pools now
      # point at the same Neon compute — see plan §8.3.
      maximum-pool-size: 3
      # As in lifey-api, and for the same reason: Neon's compute suspends when
      # nothing is connected, and an always-warm pool would prevent that
      # entirely. Let the pool drain when the chat is quiet.
      minimum-idle: 0
      idle-timeout: 60000
      max-lifetime: 240000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      # The container-wide cap. The chat's own, smaller limit
      # (lifey.chat.attachment-max-bytes) is what a caller actually hits; this
      # is the backstop for a body that never reaches the controller.
      max-file-size: 10MB
      max-request-size: 10MB
  flyway:
    enabled: true
    # Its OWN history table: two applications running Flyway against one
    # database would otherwise fight over flyway_schema_history (plan §4.2).
    table: flyway_schema_history_chat
    locations: classpath:db/migration
    # The shared database is NOT empty — it is full of the monolith's tables —
    # so without a baseline Flyway refuses to touch a schema it has no history
    # for. This says "everything below 1000 is somebody else's business"; this
    # service's own migrations start at V1000 and all run normally.
    # (An empty database, i.e. the tests, never reaches this: baselining only
    # applies to a non-empty schema.)
    baseline-on-migrate: true
    baseline-version: 999

server:
  # Render assigns the port at runtime via $PORT.
  port: ${PORT:8081}
  tomcat:
    threads:
      # An open SSE stream does NOT hold a request thread — the servlet
      # container returns it once the response goes async, which is what the
      # 200-connection load check measured (plan §15.5). So this bounds
      # ordinary request concurrency, not the number of live chat connections.
      max: 50

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      # Health is public (the Render deploy probe hits it); metrics is exposed
      # but locked to ROLE_SUPER_ADMIN in SecurityConfig. On a platform with no
      # metrics scraper this endpoint IS the dashboard — it is where
      # lifey.chat.stream.connections is read from, the number the whole
      # scaling decision rests on (devops/chat-operations.md).
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

lifey:
  cors:
    # The web admin's origin. Mobile is unaffected by CORS; the web chat breaks
    # completely without it, which is the single easiest cutover mistake to
    # make (plan §7.3).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    # MUST be bit-identical to lifey-api's JWT_SECRET — that is the entire trust
    # relationship between the two services (§5.3). This service only verifies
    # tokens; it never issues one, so there are no TTLs here.
    secret: ${JWT_SECRET:dev-only-secret-do-not-use-in-production-please-change-me-1234567890}
    # The expected `iss` claim. lifey-api mints tokens with this value.
    issuer: ${JWT_ISSUER:lifey-api}
  monolith:
    # Where lifey-api lives, for the things it still owns — today just the push
    # send (§6.1). Empty disables every outbound call, which is how a local
    # chat-only run works with no monolith next to it.
    base-url: ${LIFEY_API_INTERNAL_URL:}
    # Shared secret for /internal/**; must match LIFEY_INTERNAL_TOKEN on the
    # other side (§5.5).
    internal-token: ${LIFEY_INTERNAL_TOKEN:}
    # Short on purpose: the push runs after the message is already committed and
    # already served over REST, so a slow monolith must never hold a chat
    # request thread. A dropped push is picked up by the §5.4 reminder job.
    connect-timeout: ${LIFEY_API_CONNECT_TIMEOUT:2s}
    read-timeout: ${LIFEY_API_READ_TIMEOUT:5s}
  chat:
    # Kill switch for the trainer<->client chat (docs/chat/40-trainer-chat-plan.md).
    # Turning this off leaves every thread readable and only refuses new
    # messages (503) — the incident lever, not a feature flag for rollout.
    enabled: ${CHAT_ENABLED:true}
    # Max characters per message, enforced after trimming.
    max-body-length: ${CHAT_MAX_BODY_LENGTH:2000}
    # Keyset page sizes for GET /chat/conversations/{id}/messages.
    default-page-size: ${CHAT_DEFAULT_PAGE_SIZE:30}
    max-page-size: ${CHAT_MAX_PAGE_SIZE:100}
    # Per-user send budget. Abuse protection, not accounting: enforced in
    # memory, so each instance applies it separately (see ChatRateLimiter).
    rate-limit-per-minute: ${CHAT_RATE_LIMIT_PER_MINUTE:30}
    rate-limit-per-day: ${CHAT_RATE_LIMIT_PER_DAY:600}
    # SSE realtime (GET /api/v1/chat/stream). One connection is deliberately
    # short-lived: the client reconnects with Last-Event-ID, and a bounded
    # lifetime means a leaked emitter cannot outlive this window.
    stream-timeout: ${CHAT_STREAM_TIMEOUT:5m}
    # Comment frames keeping proxies from closing an idle stream. Must stay
    # comfortably under any reverse-proxy read timeout in front of the app.
    stream-heartbeat: ${CHAT_STREAM_HEARTBEAT:20s}
    # Most messages a reconnect replays from Last-Event-ID before the server
    # gives up and tells the client to reload over REST instead.
    stream-catch-up-limit: ${CHAT_STREAM_CATCH_UP_LIMIT:200}
    # How far back a reconnect replays *deletions* of messages the client
    # already holds. The message gap fill (`after=<id>`) only walks forward, so
    # without this a tombstone written while the client was offline never
    # reaches it — the peer keeps showing text the server has already thrown
    # away (§17.5). A week covers "my phone was off over the weekend"; anything
    # older is a client that should reload from scratch anyway.
    stream-tombstone-window: ${CHAT_STREAM_TOMBSTONE_WINDOW:7d}
    # How long "the user is looking at thread X" is believed without a refresh.
    # Losing it is safe: the fallback is sending a push that wasn't needed.
    presence-ttl: ${CHAT_PRESENCE_TTL:2m}
    # At most one push per thread per window (§5.3). A burst of messages is one
    # interruption; the count in the body comes from the read cursor, so it is
    # accurate no matter how many sends the window swallowed.
    push-coalesce-window: ${CHAT_PUSH_COALESCE_WINDOW:60s}
    # How long a message stays unread before ChatUnreadReminderJob comes back
    # for it — the safety net for a quiet hour, a mute, or a dropped push.
    reminder-after: ${CHAT_REMINDER_AFTER:30m}
    # Most reminders one user can get in a day. The reminder is the last line of
    # defence, not a second notification channel.
    reminder-daily-cap: ${CHAT_REMINDER_DAILY_CAP:1}
    # §5.5 — off by default: an email about an unread chat message reads as spam
    # very easily. Turn it on only after the metrics show how often it fires.
    email-fallback-enabled: ${CHAT_EMAIL_FALLBACK_ENABLED:false}
    email-fallback-after: ${CHAT_EMAIL_FALLBACK_AFTER:24h}
    # Image attachments (§18). The byte cap is the chat's own, checked on the
    # raw upload before re-encoding — deliberately below the container-wide
    # multipart limit, which is shared with avatar and recipe photos.
    attachment-max-bytes: ${CHAT_ATTACHMENT_MAX_BYTES:8388608}
    # Longest side of the stored image and of the bubble thumbnail; both keep
    # the picture's aspect ratio and neither enlarges a smaller original.
    # Larger than the recipe photo's 1024: a chat picture is often a form check
    # or a screenshot of a plan, where detail is the point, and it is stored
    # once and read many times.
    attachment-max-side: ${CHAT_ATTACHMENT_MAX_SIDE:1600}
    attachment-thumbnail-size: ${CHAT_ATTACHMENT_THUMBNAIL_SIZE:400}
    # Typing indicator (§19). The clients throttle at 3s; this is the server's
    # own guard, because a keystroke-driven endpoint is the easiest one in the
    # API to hammer and every accepted call writes to someone else's socket.
    typing-throttle: ${CHAT_TYPING_THROTTLE:2s}
    # How long a received "is typing" stays on screen. Not enforced anywhere on
    # the server — nothing about typing is stored — it is the shared number the
    # clients hide the indicator after.
    typing-ttl: ${CHAT_TYPING_TTL:5s}
    # In-thread search (§20). Shorter terms answer with an empty page rather
    # than an error — the clients search as you type, so a single character is
    # a normal request, not a mistake. One character would also match most of
    # a thread, which is a scan for no useful answer.
    search-min-length: ${CHAT_SEARCH_MIN_LENGTH:2}
  jobs:
    chat-unread-reminder:
      # "Still not read" sweep every 5 minutes (ChatUnreadReminderJob, §5.4).
      # Frequent because the decision is per-user-local (quiet hours) and each
      # tick only acts on users whose window has just opened.
      #
      # THIS SERVICE RUNS AS A SINGLE INSTANCE and this job is why: two
      # instances would each fire it, and duplicate reminders are the one
      # scaling hazard users actually see. See plan §6.4 before changing the
      # instance count.
      cron: ${JOB_CHAT_UNREAD_REMINDER_CRON:0 */5 * * * *}
    chat-relationship-reconciliation:
      # Nightly safety net for a lost revoke webhook (§5.4 layer 3). Nightly and
      # not more often on purpose: layer 1 (the guard on every send) already
      # makes a missed webhook harmless for correctness, so this only fixes the
      # cosmetic "the thread still looks active" case — and its real value is
      # the lifey.chat.relationship.reconciled counter it feeds, which is how a
      # silently broken webhook becomes visible at all.
      cron: ${JOB_CHAT_RELATIONSHIP_RECONCILIATION_CRON:0 15 4 * * *}

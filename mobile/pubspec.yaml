name: lifey
description: Fitness and nutrition tracker mobile app.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  dio: ^5.5.0
  intl: ^0.20.2
  flutter_secure_storage: ^10.3.1
  # Offline-first local cache (see lib/core/local_db/). Chosen over Isar:
  # Isar 3.1.0 lacks an Android `namespace` and breaks AGP 8 builds, and
  # Isar 4.x was still unstable when this was picked.
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.0
  path: ^1.9.0
  uuid: ^4.4.0
  # Drives the SyncEngine: fires on connectivity restore so queued writes go
  # out without the user needing to pull-to-refresh.
  connectivity_plus: ^7.1.1
  mobile_scanner: ^7.2.0
  # Apple Health / HealthKit integration (iOS only — see lib/core/health/ and
  # docs/16-apple-health-integration-plan.md). All reads go through HealthService,
  # which no-ops on non-iOS. Pinned to 13.x; its device_info_plus transitive dep
  # downgrades win32/flutter_secure_storage_windows, which only affects the
  # (unused) Windows desktop target.
  health: 13.3.1
  # Step-goal notification (iOS foreground/resume only — see lib/core/notifications/).
  # Re-added in the daily-steps feature after being removed with the old background
  # HKObserverQuery machinery in Prompt 1.6.
  flutter_local_notifications: ^22.0.1
  google_sign_in: ^7.2.0
  flutter_svg: ^2.3.0
  # Profile picture upload (Settings) — camera + gallery pick, see
  # lib/features/settings/data/avatar_repository.dart and docs/22-profile-picture-plan.md.
  image_picker: ^1.2.0
  # Dashboard onboarding-banner dismissal only (see lib/features/onboarding/) —
  # a plain non-sensitive per-device flag, not worth flutter_secure_storage.
  shared_preferences: ^2.5.3
  # iOS home screen widget bridge (App Group UserDefaults + WidgetKit reload)
  # — see lib/core/home_screen_widget/ and docs/24-ios-widget-live-activity-plan.md.
  # No-ops on non-iOS; also gives an Android bridge for free if that's ever added.
  home_widget: ^0.9.3
  # Android push notifications (docs/30-push-notifications-plan.md, M1b) — iOS
  # registers through the native `lifey/push` platform channel instead (M1)
  # and never touches Firebase; these two are Android-only in practice.
  firebase_core: ^4.5.0
  firebase_messaging: ^16.0.5
  # Morning weigh-in reminder scheduling (docs/30-push-notifications-plan.md,
  # M4). `timezone` is already a transitive dependency of
  # flutter_local_notifications (its zonedSchedule takes a TZDateTime) — added
  # directly per the plugin's own recommendation (depend_on_referenced_packages).
  # flutter_timezone supplies the device's IANA zone name, which the
  # `timezone` package itself has no way to determine.
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  # Cardio GPS route recording (docs/cardio/54-cardio-gps-route-plan.md D-C4.1)
  # — see lib/core/location/. Chosen over a hand-rolled MethodChannel (~600
  # lines of native permission/background-mode code on two platforms for
  # something a maintained package already solves) and over `location`
  # (weaker "always" vs. "while in use" permission-state and background
  # config handling). No `permission_handler` alongside it — geolocator's own
  # permission API is enough.
  geolocator: ^14.0.2
  # StoreKit 2 (iOS) / Play Billing (Android) purchases for mobile Pro
  # (docs/landing_page/67-mobile-free-pro-plan.md §4, `64` §6.1) — the
  # Flutter team's own plugin, one API over both stores. Prices are read
  # from the platform `ProductDetails` at purchase time, never hardcoded
  # (63 D-M1: only IAP is allowed on mobile; the trainer side never touches
  # a store).
  in_app_purchase: ^3.3.0
  # Opens the paywall's legal links (ÁSZF/Adatkezelés) in the system browser,
  # never an in-app webview (docs/landing_page/69-mobile-paywall-design-plan.md
  # §12.7) — no webview to maintain, no back-navigation edge cases.
  url_launcher: ^6.3.2
  # AdMob banners + a rate-limited interstitial for free-tier mobile users
  # (docs/landing_page/67-mobile-free-pro-plan.md §5, 63 D-M7). Google's own
  # plugin — it also ships the UMP SDK used for GDPR/TCF (EU) and ATT (iOS)
  # consent, so this one dependency covers both.
  google_mobile_ads: ^9.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  riverpod_generator: ^4.0.4
  drift_dev: ^2.20.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/google_logo.svg

  # Plus Jakarta Sans — bundled for offline-first; no runtime google_fonts fetch.
  # Weights: 400 (Regular) / 500 (Medium) / 600 (SemiBold) / 700 (Bold) / 800 (ExtraBold)
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800

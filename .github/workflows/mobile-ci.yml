name: Mobile CI

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    branches: [main, "feature/**", "bug/**"]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"

defaults:
  run:
    working-directory: mobile

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --debug

      # Wear OS watch app (redesign plan 79, X0w.4): the module needs the Flutter-generated
      # local.properties / gradlew, so it runs here after `flutter build apk` rather than as its own job.
      # The workflow's `mobile/**` filter already covers the module and the Apple token file that the
      # parity test reads (mobile/ios/LifeyWatch/Theme/LifeyColors.swift).
      - name: Build and unit-test the Wear OS module
        working-directory: mobile/android
        run: ./gradlew :wear:assembleDebug :wear:testDebugUnitTest

name: Mobile CI

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    branches: [main, "feature/**", "bug/**"]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"

defaults:
  run:
    working-directory: mobile

# Least privilege for the GITHUB_TOKEN (LIF-188): these jobs only read the repo.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned (LIF-185, moved to 3.50.1 in LIF-192): an unpinned `channel:
      # stable` silently moves CI to a new SDK whose deprecations then fail
      # `flutter analyze` (that is how the material_ui migration surfaced).
      # Keep this equal to the local SDK and bump it deliberately.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      # Design-system drift gate (docs/redesign/77 R7.1): raw font sizes, Color(0x..), legacy radii and
      # AppBars outside the DS. The count is 0 today, so any new hit fails the build.
      - name: Design audit
        run: dart run tool/design_audit.dart --strict

      - name: Run tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --debug

      # Wear OS watch app (redesign plan 79, X0w.4): the module needs the Flutter-generated
      # local.properties / gradlew, so it runs here after `flutter build apk` rather than as its own job.
      # The workflow's `mobile/**` filter already covers the module and the Apple token file that the
      # parity test reads (mobile/ios/LifeyWatch/Theme/LifeyColors.swift).
      - name: Build and unit-test the Wear OS module
        working-directory: mobile/android
        run: ./gradlew :wear:assembleDebug :wear:testDebugUnitTest

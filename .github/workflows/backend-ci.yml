name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "devops/check-schema-ownership.sh"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main, "feature/**", "bug/**"]
    paths:
      - "backend/**"
      - "devops/check-schema-ownership.sh"
      - ".github/workflows/backend-ci.yml"

defaults:
  run:
    working-directory: backend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Cheap and first: a migration that reaches across the chat/monolith
      # schema boundary should fail in review, not after it has already run.
      # See docs/chat/44-chat-service-extraction-plan.md §4.2.
      - name: Check schema ownership
        working-directory: .
        run: ./devops/check-schema-ownership.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "24"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build and run tests
        run: ./mvnw -B verify

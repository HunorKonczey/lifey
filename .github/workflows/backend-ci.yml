name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "devops/check-schema-ownership.sh"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main, "feature/**", "bug/**"]
    paths:
      - "backend/**"
      - "devops/check-schema-ownership.sh"
      - ".github/workflows/backend-ci.yml"

defaults:
  run:
    working-directory: backend

# Least privilege for the GITHUB_TOKEN (LIF-188): these jobs only read the repo.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Cheap and first: a migration that reaches across the chat/monolith
      # schema boundary should fail in review, not after it has already run.
      # See docs/chat/44-chat-service-extraction-plan.md §4.2.
      - name: Check schema ownership
        working-directory: .
        run: ./devops/check-schema-ownership.sh

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build and run tests
        run: ./mvnw -B verify

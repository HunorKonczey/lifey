# Dependency monitoring for every ecosystem in the repo (LIF-188, epic LIF-178).
# Security updates are opened as soon as an advisory lands (enable "Dependabot
# security updates" in the repo settings); the weekly version updates below are
# grouped so each ecosystem yields one minor/patch PR instead of dozens.
# Majors arrive as separate PRs, because each one needs its own look.
#
# `ignore` entries are known blockers, each with the Jira story that lifts it
# (LIF-193). Remove the entry when that story lands, so updates resume.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    groups:
      backend-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: maven
    directory: /chat
    schedule:
      interval: weekly
    groups:
      chat-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web-minor-patch:
        update-types: [minor, patch]
    ignore:
      # LIF-189: on TypeScript 6.0 (the last JS-based compiler). TypeScript 7 is the
      # native Go compiler, and typescript-eslint (peer typescript <6.1.0 as of
      # 8.73) cannot use it yet; drop this rule once its peer range covers 7.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: pub
    directory: /mobile
    schedule:
      interval: weekly
    # Lockfile-only: with the default "increase" strategy Dependabot rewrote
    # unrelated pubspec constraints (intl ^0.20.3, health 14.0.0) despite the
    # ignore list below (#181). Constraint bumps stay deliberate, per story.
    versioning-strategy: lockfile-only
    groups:
      mobile-minor-patch:
        update-types: [minor, patch]
    ignore:
      # The Flutter SDK pins intl (flutter_localizations depends on one exact
      # version), so a newer intl only resolves when the pinned SDK moves.
      - dependency-name: intl

  - package-ecosystem: gradle
    directory: /mobile/android
    schedule:
      interval: weekly
    groups:
      android-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/backend, /chat, /web]
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

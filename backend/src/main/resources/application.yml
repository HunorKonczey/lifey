spring:
  application:
    name: lifey-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lifey}
    username: ${SPRING_DATASOURCE_USERNAME:lifey}
    password: ${SPRING_DATASOURCE_PASSWORD:lifey}
    hikari:
      # Default is 10 — each pooled connection holds buffers on both this
      # app's and Postgres' side, not worth it for a low-traffic free-tier
      # deployment with a capped heap.
      maximum-pool-size: 5
      # The next three exist for Neon, whose compute suspends after a few
      # minutes with no open connections and resumes on the next one.
      #
      # An always-warm pool would defeat that entirely — the compute would
      # never see an idle moment and never scale to zero. Worse, a connection
      # held across a suspend comes back dead, and the borrowing request is
      # the one that finds out. So: let the pool drain to nothing when the
      # app is quiet (minimum-idle 0), retire idle connections quickly
      # (idle-timeout), and cap absolute connection age below any plausible
      # server-side idle cutoff (max-lifetime) so recycling is our decision
      # rather than something we discover mid-request.
      #
      # Cost: a request arriving into an empty pool pays one connection
      # handshake, plus Neon's resume (~a few hundred ms) if the compute had
      # suspended. Acceptable for this traffic level.
      minimum-idle: 0
      idle-timeout: 60000
      max-lifetime: 240000
      keepalive-time: 0
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      # Profile picture and recipe photo uploads (docs/22-profile-picture-plan.md)
      # — well above a re-encoded image but small enough to bound memory per
      # request, and generous enough for a camera photo before the server resizes it.
      # Sonar (java:S5693) flags this as above its generic 8MB DoS-prevention
      # default — reviewed and accepted: both upload endpoints require
      # authentication (not anonymous/public), accept one file per request,
      # and re-encode/resize the image server-side immediately after upload
      # (see ImageReencoder), so 10MB buys real camera-photo headroom without
      # a meaningfully larger abuse surface than 8MB would.
      max-file-size: 10MB
      max-request-size: 10MB
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  # Render (and most PaaS hosts) assign the container a port at runtime via
  # $PORT and route their public proxy to it — the app must bind to that, not
  # a fixed port. Falls back to 8080 for local/dev where $PORT isn't set.
  port: ${PORT:8080}
  tomcat:
    threads:
      # Default max is 200 — each thread reserves its own stack, which adds
      # up fast against a capped heap. 200 concurrent requests is far more
      # than this deployment needs anyway.
      max: 50

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      # Health is public (the deploy probe hits it); metrics is exposed but
      # locked to ROLE_SUPER_ADMIN in SecurityConfig — on a platform with no
      # metrics scraper that endpoint is the only way to read this
      # application's counters. Everything else (env, beans, mappings, ...)
      # stays unreachable, so no internals leak.
      exposure:
        include: health,metrics
  endpoint:
    health:
      # Plain UP/DOWN for unauthenticated callers — don't leak component details
      # (db, disk, ...) on a public health-check endpoint.
      show-details: never
      # Adds /actuator/health/liveness and /readiness groups for PaaS probes.
      probes:
        enabled: true

lifey:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  cookie:
    # Secure must be true in production (HTTPS). Left false for local http dev,
    # otherwise the browser won't store/send the refresh cookie over http.
    secure: ${COOKIE_SECURE:false}
    # Lax works when web and API share a site (e.g. localhost:3000 ↔ localhost:8080,
    # or app.example.com ↔ api.example.com). Use None (with secure=true) for cross-site.
    same-site: ${COOKIE_SAME_SITE:Lax}
  jwt:
    # Dev-only default. MUST be overridden via JWT_SECRET in any shared/production
    # environment — anyone with this value can forge access tokens for any user.
    secret: ${JWT_SECRET:dev-only-secret-do-not-use-in-production-please-change-me-1234567890}
    access-token-ttl: ${JWT_ACCESS_TTL:7d}
    refresh-token-ttl: ${JWT_REFRESH_TTL:30d}
    issuer: lifey-api
  starter-catalog:
    # Seeds every newly registered user with a starter exercise catalog
    # (StarterCatalogListener) — handy for local dev/demo accounts, but real
    # users shouldn't have the same handful of exercises forced onto them.
    # Off in prod (application-prod.yml).
    enabled: ${STARTER_CATALOG_ENABLED:true}
  oauth:
    google:
      # Comma-separated list of accepted audiences: Android, iOS, and Web OAuth
      # client IDs — any of the three is a valid ID-token audience.
      client-ids: ${OAUTH_GOOGLE_CLIENT_IDS:}
      # Google's published JWKS endpoint — override only for pointing at a
      # local mock JWKS server in a non-prod environment.
      jwks-uri: ${OAUTH_GOOGLE_JWKS_URI:https://www.googleapis.com/oauth2/v3/certs}
  openfoodfacts:
    base-url: ${OPENFOODFACTS_BASE_URL:https://world.openfoodfacts.org}
    # OpenFoodFacts requires a descriptive User-Agent identifying the app and a
    # contact. Override the contact in deployments via OPENFOODFACTS_USER_AGENT.
    user-agent: ${OPENFOODFACTS_USER_AGENT:Lifey/1.0 (hunorkonczey@gmail.com)}
  mail:
    # Resend's shared test domain — works without owning/verifying a domain,
    # but only delivers to the email address the RESEND_API_KEY account was
    # signed up with. Switch to a verified domain address once one exists.
    from: ${MAIL_FROM:onboarding@resend.dev}
    # Off by default (no RESEND_API_KEY locally) — the sender logs instead of
    # sending so local dev and tests never require a real Resend account.
    enabled: ${MAIL_ENABLED:false}
    resend-api-key: ${RESEND_API_KEY:}
    # Where the marketing contact form (docs/landing_page/65 Prompt 8) delivers to —
    # matches the address already printed in the footer (web messages: footer.email).
    contact-to: ${MAIL_CONTACT_TO:hello@lifey.hu}
  push:
    apns:
      # Off by default — no bean is created (see ApnsPushSender's
      # @ConditionalOnProperty), so local dev/CI never need a real APNs key.
      enabled: ${PUSH_APNS_ENABLED:false}
      # Path to the .p8 token-auth signing key downloaded from the Apple
      # Developer portal (Keys > Push Notifications).
      key-path: ${PUSH_APNS_KEY_PATH:}
      key-id: ${PUSH_APNS_KEY_ID:}
      team-id: ${PUSH_APNS_TEAM_ID:}
      bundle-id: ${PUSH_APNS_BUNDLE_ID:com.khunor.lifey}
      # True for development-signed builds (Xcode debug); false in production.
      sandbox: ${PUSH_APNS_SANDBOX:true}
    fcm:
      # Off by default — no Firebase beans are created (see FcmConfig's
      # @ConditionalOnProperty), so local dev/CI never need real Firebase
      # credentials.
      enabled: ${PUSH_FCM_ENABLED:false}
      # Path to the Firebase service-account JSON key (Firebase console >
      # Project settings > Service accounts > Generate new private key).
      credentials-path: ${PUSH_FCM_CREDENTIALS_PATH:}
  trainer-invite:
    # Optional email channel for accepting a trainer invite, alongside the
    # existing mobile polling flow (ClientInviteController). Off by default —
    # the mobile flow alone is unaffected either way.
    email-enabled: ${TRAINER_INVITE_EMAIL_ENABLED:false}
    # Used to build the accept/decline links in the invite email; the links
    # point back at this backend's own public endpoint, not a frontend route.
    public-base-url: ${TRAINER_INVITE_PUBLIC_BASE_URL:http://localhost:8080}
  # The seam with lifey-chat, in both directions
  # (docs/chat/44-chat-service-extraction-plan.md §5.5, §6.1).
  internal:
    # Shared secret for /internal/**. EMPTY CLOSES the internal API rather than
    # opening it: with no secret configured every inbound call is rejected.
    token: ${LIFEY_INTERNAL_TOKEN:}
    # Where lifey-chat lives, for the revoke webhook (§5.4). Empty disables the
    # webhook — useful locally when no chat service is running.
    chat-url: ${CHAT_INTERNAL_URL:}
    # Short: the webhook fires after the revoke has already committed, so a slow
    # chat service must not hold a request thread.
    connect-timeout: ${CHAT_INTERNAL_CONNECT_TIMEOUT:2s}
    read-timeout: ${CHAT_INTERNAL_READ_TIMEOUT:5s}
  client-config:
    # Where clients should send chat traffic, handed to them by
    # GET /api/v1/client-config (§7.1). EMPTY means "this API serves the chat",
    # which is what every client falls back to — so an unset variable degrades
    # to a 404 on the chat routes rather than to a broken app.
    chat-base-url: ${CHAT_PUBLIC_BASE_URL:}
    # How long clients may cache the answer. Drop this to 300 around a rollout
    # so a change — or a rollback — propagates in minutes.
    ttl-seconds: ${CLIENT_CONFIG_TTL_SECONDS:21600}
  billing:
    # The billing feature's own rollback switch (docs/landing_page/64-billing-backend-plan.md
    # §1 point 6, §14 risk 1). MUST default to false: with it off, every user
    # resolves an open PRO/COMP entitlement and every seat check passes, which
    # is what makes this deployable before any client understands billing.
    # Flip to true per environment, explicitly, once the paid rails are wired.
    enabled: ${BILLING_ENABLED:false}
    # Free-tier history window shown to the mobile app (64 §3.3) — a display
    # limit, so changing it is a config change, not a store release.
    free-history-days: ${BILLING_FREE_HISTORY_DAYS:30}
    # Free-tier monthly AI call allowance (64 §3.4); null-equivalent (unlimited) on Pro.
    free-ai-credits-per-month: ${BILLING_FREE_AI_CREDITS_PER_MONTH:5}
    # How long a cached entitlement snapshot stays valid offline (63 D-M10).
    offline-grace-days: ${BILLING_OFFLINE_GRACE_DAYS:7}
    # Per-run cap on BillingReconciliationJob's provider re-fetch (64 §7) — keeps a
    # large account base from blowing Stripe/Apple/Google's rate limits every night.
    reconciliation-batch-size: ${BILLING_RECONCILIATION_BATCH_SIZE:200}
    stripe:
      # Empty by default — StripeBillingService is only ever reached from a
      # ROLE_TRAINER checkout/portal request, so an empty key just means those
      # two endpoints fail loudly instead of the app failing to start.
      secret-key: ${STRIPE_SECRET_KEY:}
      # Empty by default — an empty secret makes Webhook.constructEvent fail
      # signature verification for every request, i.e. fails closed (64 §5.3).
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
      # Where Checkout sends the browser back; a UI convenience only — the
      # webhook (64 Prompt 5), not this redirect, is the source of truth (D-B5).
      success-url: ${STRIPE_SUCCESS_URL:http://localhost:3000/admin/billing?checkout=success}
      cancel-url: ${STRIPE_CANCEL_URL:http://localhost:3000/admin/billing?checkout=cancel}
      portal-return-url: ${STRIPE_PORTAL_RETURN_URL:http://localhost:3000/admin/billing}
      # The six Prices (3 plans x monthly/yearly), created once in the Stripe
      # dashboard and referenced by id — never created from code (64 §5.1).
      starter-monthly-price-id: ${STRIPE_PRICE_STARTER_MONTHLY:}
      starter-yearly-price-id: ${STRIPE_PRICE_STARTER_YEARLY:}
      pro-monthly-price-id: ${STRIPE_PRICE_PRO_MONTHLY:}
      pro-yearly-price-id: ${STRIPE_PRICE_PRO_YEARLY:}
      studio-monthly-price-id: ${STRIPE_PRICE_STUDIO_MONTHLY:}
      studio-yearly-price-id: ${STRIPE_PRICE_STUDIO_YEARLY:}
    apple:
      bundle-id: ${APPLE_BUNDLE_ID:}
      app-apple-id: ${APPLE_APP_APPLE_ID:}
      # SANDBOX by default so a fresh environment can't accidentally accept
      # production receipts, or vice versa — SignedDataVerifier rejects any
      # transaction whose own embedded environment doesn't match this (64 §11.5).
      environment: ${APPLE_ENVIRONMENT:SANDBOX}
      # Empty by default — the App Store Server API confirmation step
      # (StoreBillingServiceImpl) treats a missing/invalid key exactly like a
      # real API outage: logged and swallowed, since local JWS verification
      # alone already grants Pro (64 §6.1).
      issuer-id: ${APPLE_ISSUER_ID:}
      key-id: ${APPLE_KEY_ID:}
      private-key: ${APPLE_PRIVATE_KEY:}
    google:
      package-name: ${GOOGLE_PLAY_PACKAGE_NAME:}
      # Empty by default — the whole Play verification call fails closed with
      # no key configured (unlike Apple's confirmation step, this one isn't
      # optional: it's the only verification Android purchases get, 64 §6.1).
      service-account-json: ${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:}
      # Play RTDN webhook (64 §6.2) — both empty by default, so PubSubTokenVerifier
      # rejects every push delivery until the Pub/Sub subscription is actually configured.
      pubsub-audience: ${GOOGLE_PUBSUB_AUDIENCE:}
      pubsub-service-account-email: ${GOOGLE_PUBSUB_SERVICE_ACCOUNT_EMAIL:}
  jobs:
    password-reset-cleanup:
      # Daily sweep removing expired/used password reset tokens (PasswordResetTokenCleanupJob).
      cron: ${JOB_PASSWORD_RESET_CLEANUP_CRON:0 0 3 * * *}
    trainer-weekly-report:
      # Weekly trainer report email, every Monday (TrainerWeeklyReportJob).
      cron: ${JOB_TRAINER_WEEKLY_REPORT_CRON:0 0 5 * * MON}
    trainer-client-cleanup:
      # Daily sweep expiring stale PENDING trainer invites (TrainerClientCleanupJob).
      cron: ${JOB_TRAINER_CLIENT_CLEANUP_CRON:0 30 3 * * *}
    workout-reminder:
      # Per-user-local-time workout reminder tick, every 15 minutes (WorkoutReminderJob).
      cron: ${JOB_WORKOUT_REMINDER_CRON:0 0 * * * *}
    billing-reconciliation:
      # Daily billing safety net, 03:30 Europe/Budapest — trial expiry (64
      # Prompt 7) plus the provider re-fetch/diff/metrics sweep (64 Prompt 11).
      cron: ${JOB_BILLING_RECONCILIATION_CRON:0 30 3 * * *}

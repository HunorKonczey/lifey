# Production-only overrides. Activate by setting SPRING_PROFILES_ACTIVE=prod
# on the deployment (it is set in render.yaml for the Render service).
#
# Swagger UI and the OpenAPI spec are dev/internal tooling — disabling both
# means /swagger-ui.html and /v3/api-docs return 404 in production, so the API
# surface isn't advertised publicly.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
lifey:
  mail:
    enabled: true
  backfill:
    food-fiber-sugar:
      # The first deploy after LIF-145 fills fibre and sugar of the foods saved before it, from OpenFoodFacts, once
      # (FOOD_FIBER_SUGAR_BACKFILL_ENABLED=false switches it off without a deploy of code).
      enabled: ${FOOD_FIBER_SUGAR_BACKFILL_ENABLED:true}
  starter-catalog:
    enabled: false
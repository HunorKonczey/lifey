# SUPERSEDED by ../render.yaml — the backend now deploys to Render (see
# devops/deploy-backend-render.md). Kept only so the old Railway service can be
# brought back as a rollback path during the migration window; delete this file
# (and the Railway project) once Render has been stable for a couple of weeks.

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Public, unauthenticated endpoint (see SecurityConfig.PUBLIC_ENDPOINTS) —
# used so Railway's healthcheck gets a 200 instead of a 401/403 from the JWT
# filter on every other route.
healthcheckPath = "/actuator/health"
healthcheckTimeout = 100
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
